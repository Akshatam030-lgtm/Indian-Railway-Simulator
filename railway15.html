{const J=$('joy'),K=$('knob');let ja=false;const mv=e=>{const r=J.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}jx=dx;jy=dy;K.style.left=(35+dx*35)+'px';K.style.top=(35+dy*35)+'px'};
 J.addEventListener('pointerdown',e=>{ja=true;J.setPointerCapture(e.pointerId);mv(e)});J.addEventListener('pointermove',e=>{if(ja)mv(e)});const en=()=>{ja=false;jx=jy=0;K.style.left='35px';K.style.top='35px'};J.addEventListener('pointerup',en);J.addEventListener('pointercancel',en);
 [['fUp',v=>fUp=v],['fDn',v=>fDn=v],['fFast',v=>fFast=v]].forEach(([id,f])=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();f(1);b.classList.add('on')});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>{f(0);b.classList.remove('on')}))})}

addEventListener('keydown',e=>{if(camMode===2){(window.__fk||(window.__fk={}))[e.code]=1;return}if(e.code==='KeyW'){thr=Math.min(1,thr+0.1);$('thrf').style.height=thr*100+'%'}if(e.code==='KeyS'){thr=Math.max(0,thr-0.1);$('thrf').style.height=thr*100+'%'}if(e.code==='Space')brk=1;if(e.code==='KeyH')horn()});
addEventListener('keyup',e=>{(window.__fk||(window.__fk={}))[e.code]=0;if(e.code==='Space')brk=0});
const dc=$('dial').getContext('2d');
function dial(kmh){dc.clearRect(0,0,170,110);dc.fillStyle='#0b1118dd';dc.beginPath();dc.arc(85,90,80,Math.PI,2*Math.PI);dc.fill();dc.strokeStyle='#fff8';dc.lineWidth=2;dc.font='10px sans-serif';dc.fillStyle='#fff';dc.textAlign='center';
 for(let k=0;k<=160;k+=20){const a=Math.PI+k/160*Math.PI,c=Math.cos(a),s2=Math.sin(a);dc.beginPath();dc.moveTo(85+c*66,90+s2*66);dc.lineTo(85+c*76,90+s2*76);dc.stroke();dc.fillText(k,85+c*55,93+s2*55)}
 const a=Math.PI+Math.min(kmh,160)/160*Math.PI;dc.strokeStyle='#f5b82e';dc.lineWidth=3;dc.beginPath();dc.moveTo(85,90);dc.lineTo(85+Math.cos(a)*62,90+Math.sin(a)*62);dc.stroke();
 dc.fillStyle='#f5b82e';dc.font='bold 20px sans-serif';dc.fillText(Math.round(kmh),85,78);dc.font='9px sans-serif';dc.fillStyle='#fff';dc.fillText('km/h',85,89)}
let PXT=0;
function trkChange(k){const dir=sel.dir,q=STN.findIndex(r=>Math.abs(s-r[1])<260);let xs=[-2.5,2.5];
 if(q>=0){const P=STN[q][2],T=STN[q][3],nN=Math.ceil(P/2),nS=Math.floor(P/2),tN=nN+1,tS=T-tN;xs=[];for(let m=tN-1;m>=0;m--)xs.push(-(m===0?2.5:11+9*(m-1)));for(let m=0;m<tS;m++)xs.push(m===0?2.5:11+9*(m-1))}
 let i=0,bd=1e9;xs.forEach((x,j)=>{const dd=Math.abs(x-PXT);if(dd<bd){bd=dd;i=j}});const j=Math.max(0,Math.min(xs.length-1,i+k*(dir>0?1:-1)));if(j===i){toast('Is taraf aur track nahi hai ('+(i+1)+'/'+xs.length+')');return}PXT=xs[j];toast('Track change: '+(j+1)+' / '+xs.length+(q>=0?'':' (main line)'))}
function tick(){const dt=Math.min(clock.getDelta(),0.1),dir=sel.dir;PX+=(PXT-PX)*Math.min(1,dt*1.2);if(!STN.some(r=>Math.abs(s-r[1])<520)&&Math.abs(PXT)>3)PXT=PXT<0?-2.5:2.5;
 let a=thr*0.9*grip-brk*1.2*grip-0.012-0.00012*v*v;if(v<=0&&a<0)a=0;v=Math.max(0,Math.min(gear<0?8.3:VMAX,v+a*dt));
 s+=dir*gear*v*dt;if(s<0){s=0;v=0}if(s>LEN){s=LEN;v=0}
 audioTick(dt);updateAI(dt);sysTick(dt,dir);placeWorld();const z=-s;const ey=elev(s);train.position.set(PX,ey,z);locoUnits.forEach(u=>u.rotation.y=(dir>0?0:Math.PI)+Math.PI+(sel.mf[u.userData.slot]?Math.PI:0));if(lampF){lampF.color.setHex(gear>0?0xffffff:0xcc1111);lampR.color.setHex(gear>0?0xcc1111:0xffffff)}if(spot){const lz=gear>0?-dir*trainL/2:dir*trainTot,sg=gear>0?-dir:dir;spot.position.set(B(z+lz),3,lz);spot.target.position.set(B(z+lz+sg*80),1,lz+sg*80)}
 sky.position.set(0,0,z);sunL.position.set(PX+B(z)+90,ey+150,z+60);sunL.target.position.set(PX+B(z),ey,z);sunL.target.updateMatrixWorld();
 const zt=z-dir*Math.max(0,trainL/2-14);
 const fk=window.__fk||(window.__fk={});
 if(camMode===2){const sp=(fFast?150:25)*dt,fw=(jy>0.1?jy:0)||0;let mf=-jy,mr=jx,mu=(fUp?1:0)-(fDn?1:0);if(fk.KeyW)mf=1;if(fk.KeyS)mf=-1;if(fk.KeyD)mr=1;if(fk.KeyA)mr=-1;if(fk.KeyE)mu=1;if(fk.KeyQ)mu=-1;
  const cy=Math.cos(fyaw),sy=Math.sin(fyaw);fcx+=(-sy*mf*-1*0+(-Math.sin(fyaw))*(-mf)*0)+(-sy*(-mf)*-1)*0;
  fcx+=(-sy*mf+cy*mr)*sp*-1*-1;fcz+=(-cy*mf-sy*mr)*sp*-1*-1;fcy=Math.max(1,fcy+mu*sp);
  cam.position.set(fcx+B(fcz),fcy,fcz);cam.lookAt(fcx+B(fcz)-Math.sin(fyaw)*Math.cos(fpitch),fcy+Math.sin(fpitch),fcz-Math.cos(fyaw)*Math.cos(fpitch))}
 else if(camMode===0){const cp=Math.cos(pitch);cam.position.set(PX+B(zt+Math.cos(yaw)*dist*cp)+Math.sin(yaw)*dist*cp,ey+3.2+Math.sin(pitch)*dist,zt+Math.cos(yaw)*dist*cp);cam.lookAt(PX+B(zt),ey+3.2,zt)}
 else{cam.position.set(PX+B(z-dir*(trainL*0.5-2.5)),ey+3.6,z-dir*(trainL*0.5-2.5));cam.lookAt(PX+B(z-dir*120),ey+3.2,z-dir*120)}
 let ns=null;const pq=plan.stops[plan.i];if(plan.on&&!plan.done&&pq!=null)ns=[SX(pq)[0],(SX(pq)[1]-s)*dir];
 const dd=Math.abs(STN[sel.to][1]-s);if(dd<40&&v<1.5&&!tick.arr){tick.arr=1;toast('Destination reached: '+STN[sel.to][0])}if(dd>200)tick.arr=0;
 $('nsn').textContent=ns?ns[0]:'End of route';$('nsd').textContent=ns?(ns[1]/1000).toFixed(2)+' km':'';
 sky.position.copy(cam.position);dial(v*3.6);R.render(scene,cam)}
